name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-node24:
    name: Windows Node 24
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # Vitest validates historical commits in the capability dictionary.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Windows sandbox test helper
        run: npm run sandbox:build

      - name: Test
        run: npm test -- --maxWorkers=1 --testTimeout=20000
